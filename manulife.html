<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manulife - Investment Loan Application</title>
<style>
  :root {
    --brand: #00854A;
    --brand-dark: #005c33;
    --grey: #f4f4f4;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--grey); color: #222; }
  header {
    background: var(--brand);
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .logo { font-weight: 700; font-size: 22px; letter-spacing: 0.5px; }
  header .env-tag { font-size: 12px; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 4px; }
  .back-link { color: white; font-size: 13px; text-decoration: underline; opacity: 0.9; }
  .container { max-width: 760px; margin: 32px auto; background: white; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); overflow: hidden; }
  .banner { background: var(--brand-dark); color: white; padding: 16px 32px; font-size: 18px; font-weight: 600; }
  form { padding: 32px; }
  fieldset { border: 1px solid #ddd; border-radius: 4px; margin-bottom: 24px; padding: 16px 20px 20px; }
  legend { font-weight: 600; color: var(--brand-dark); padding: 0 8px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: #333; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  input:focus, select:focus { outline: none; border-color: var(--brand); }
  .row2 { display: flex; gap: 16px; }
  .row2 > div { flex: 1; }
  .helper { font-size: 12px; color: #777; margin-top: 3px; }
  button { background: var(--brand); color: white; border: none; padding: 13px 28px; font-size: 15px; font-weight: 600; border-radius: 4px; cursor: pointer; margin-top: 8px; }
  button:hover { background: var(--brand-dark); }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .status { margin-top: 16px; padding: 12px 16px; border-radius: 4px; font-size: 14px; display: none; }
  .status.success { background: #e6f4ea; color: #1e7e34; display: block; }
  .status.error { background: #fdecea; color: #c0392b; display: block; }
  .next-step { margin-top: 20px; padding: 16px; background: #f0f8f3; border: 1px solid #cfe8d8; border-radius: 4px; font-size: 14px; display: none; }
  .next-step a { color: var(--brand-dark); font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="logo">Manulife</div>
  <a class="back-link" href="index.html">&larr; Back to portal home</a>
</header>

<div class="container">
  <div class="banner">Investment Loan Application</div>
  <form id="loanForm">

    <fieldset>
      <legend>Submitting Representative</legend>
      <div class="row2">
        <div>
          <label for="repName">Representative Name</label>
          <input type="text" id="repName" name="repName" required>
        </div>
        <div>
          <label for="repRole">Role / Title</label>
          <input type="text" id="repRole" name="repRole" value="Fund & Loan Administrator, Client Operations" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Client Personal Information</legend>
      <div class="row2">
        <div>
          <label for="fullName">Full Legal Name</label>
          <input type="text" id="fullName" name="fullName" required>
        </div>
        <div>
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" required>
        </div>
      </div>
      <label for="sin">Social Insurance Number (SIN)</label>
      <input type="text" id="sin" name="sin" placeholder="000-000-000" required>
      <label for="address">Home Address</label>
      <input type="text" id="address" name="address" required>
      <div class="row2">
        <div>
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required>
        </div>
        <div>
          <label for="email">Client Email</label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Loan Details</legend>
      <div class="row2">
        <div>
          <label for="loanAmount">Requested Loan Amount ($ CAD)</label>
          <input type="number" id="loanAmount" name="loanAmount" required>
        </div>
        <div>
          <label for="annualIncome">Gross Annual Income ($ CAD)</label>
          <input type="number" id="annualIncome" name="annualIncome" required>
        </div>
      </div>
      <div class="row2">
        <div>
          <label for="netWorth">Net Worth ($ CAD)</label>
          <input type="number" id="netWorth" name="netWorth" required>
        </div>
        <div>
          <label for="monthlyDebt">Total Monthly Debt Service ($ CAD)</label>
          <input type="number" id="monthlyDebt" name="monthlyDebt" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Employment</legend>
      <div class="row2">
        <div>
          <label for="employer">Employer / Business Name</label>
          <input type="text" id="employer" name="employer" required>
        </div>
        <div>
          <label for="yearsEmployed">Years at Current Employer</label>
          <input type="number" id="yearsEmployed" name="yearsEmployed" required>
        </div>
      </div>
    </fieldset>

    <input type="hidden" id="lender" name="lender" value="Manulife">

    <button type="submit" id="submitBtn">Submit Loan Application</button>
    <div class="status" id="statusBox"></div>
    <div class="next-step" id="nextStep">
      ✅ Loan application submitted. <a href="investment-account.html">Continue to Investment Account Setup &rarr;</a>
    </div>
  </form>
</div>

<script>
const SCRIPT_URL = "REPLACE_WITH_DEPLOYED_APPS_SCRIPT_URL";

document.getElementById('loanForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('statusBox');
  const nextStep = document.getElementById('nextStep');
  const formData = new FormData(this);
  const data = Object.fromEntries(formData.entries());
  data.submissionType = "Loan Application";
  data.submittedAt = new Date().toISOString();
  data.confirmationNumber = "MFL-" + Math.floor(100000 + Math.random() * 900000);

  btn.disabled = true;
  btn.textContent = "Submitting...";

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(() => {
    status.className = "status success";
    status.textContent = "✅ Application submitted. Confirmation number: " + data.confirmationNumber + " — note this for your handoff and simulation sheet.";
    btn.textContent = "Submitted";
    nextStep.style.display = "block";
  })
  .catch((err) => {
    status.className = "status error";
    status.textContent = "❌ Submission failed — check your connection and try again, or contact recruiting@usegoodwork.com.";
    btn.disabled = false;
    btn.textContent = "Submit Loan Application";
    console.error(err);
  });
});
</script>

</body>
</html>
