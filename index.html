<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iWIN Loan Submission Portal</title>
<style>
  :root {
    --iwin-green: #00854A;
    --iwin-dark: #005c33;
    --grey: #f4f4f4;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    background: var(--grey);
    color: #222;
  }
  header {
    background: var(--iwin-green);
    color: white;
    padding: 18px 32px;
  }
  header .logo { font-weight: 700; font-size: 22px; letter-spacing: 0.5px; }
  .container {
    max-width: 640px;
    margin: 48px auto;
    background: white;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    overflow: hidden;
    text-align: center;
    padding: 48px 32px;
  }
  h1 { color: var(--iwin-dark); font-size: 22px; margin-bottom: 8px; }
  p.sub { color: #666; margin-bottom: 32px; font-size: 14px; }
  .lender-buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .lender-btn {
    display: block;
    width: 220px;
    padding: 24px 16px;
    border: 2px solid var(--iwin-green);
    border-radius: 8px;
    text-decoration: none;
    color: var(--iwin-dark);
    font-weight: 700;
    font-size: 17px;
    transition: background 0.15s;
  }
  .lender-btn:hover { background: #e6f4ea; }
  .lender-btn .sub-label {
    display: block;
    font-weight: 400;
    font-size: 12px;
    color: #777;
    margin-top: 6px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">iWIN Wealth Planning</div>
</header>

<div class="container">
  <h1>Loan Submission Portal</h1>
  <p class="sub">Select the lender for this client's loan application.</p>
  <div class="lender-buttons">
    <a class="lender-btn" href="manulife.html">
      Manulife
      <span class="sub-label">Investment Loan Application</span>
    </a>
    <a class="lender-btn" href="duca.html">
      DUCA
      <span class="sub-label">Investment Loan Application</span>
    </a>
  </div>
</div>

</body>
</html>
