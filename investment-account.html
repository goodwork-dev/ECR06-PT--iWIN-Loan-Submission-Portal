<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manulife Investments - New Account Setup</title>
<style>
  :root {
    --brand: #003DA5;
    --brand-dark: #002B73;
    --grey: #f4f4f4;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: var(--grey); color: #222; }
  header {
    background: var(--brand);
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .logo { font-weight: 700; font-size: 22px; letter-spacing: 0.5px; }
  header .env-tag { font-size: 12px; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 4px; }
  .back-link { color: white; font-size: 13px; text-decoration: underline; opacity: 0.9; }
  .container { max-width: 760px; margin: 32px auto; background: white; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); overflow: hidden; }
  .banner { background: var(--brand-dark); color: white; padding: 16px 32px; font-size: 18px; font-weight: 600; }
  form { padding: 32px; }
  fieldset { border: 1px solid #ddd; border-radius: 4px; margin-bottom: 24px; padding: 16px 20px 20px; }
  legend { font-weight: 600; color: var(--brand-dark); padding: 0 8px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: #333; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  input:focus, select:focus { outline: none; border-color: var(--brand); }
  .row2 { display: flex; gap: 16px; }
  .row2 > div { flex: 1; }
  .helper { font-size: 12px; color: #777; margin-top: 3px; }
  .locked-field { background: #eee; color: #555; }
  .locked-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #ddd;
    color: #666;
    padding: 2px 8px;
    border-radius: 3px;
    margin-left: 8px;
    vertical-align: middle;
  }
  button { background: var(--brand); color: white; border: none; padding: 13px 28px; font-size: 15px; font-weight: 600; border-radius: 4px; cursor: pointer; margin-top: 8px; }
  button:hover { background: var(--brand-dark); }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .status { margin-top: 16px; padding: 12px 16px; border-radius: 4px; font-size: 14px; display: none; }
  .status.success { background: #e6f0fa; color: #003DA5; display: block; }
  .status.error { background: #fdecea; color: #c0392b; display: block; }
</style>
</head>
<body>

<header>
  <div class="logo">Manulife Investments</div>
  <a class="back-link" href="index.html">&larr; Back to portal home</a>
</header>

<div class="container">
  <div class="banner">New Segregated Fund Account Application</div>
  <form id="accountForm">

    <fieldset>
      <legend>Submitting Representative</legend>
      <div class="row2">
        <div>
          <label for="repName">Representative Name</label>
          <input type="text" id="repName" name="repName" required>
        </div>
        <div>
          <label for="repRole">Role / Title</label>
          <input type="text" id="repRole" name="repRole" value="Fund & Loan Administrator, Client Operations" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Client Information</legend>
      <div class="row2">
        <div>
          <label for="fullName">Full Legal Name</label>
          <input type="text" id="fullName" name="fullName" required>
        </div>
        <div>
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" required>
        </div>
      </div>
      <label for="sin">Social Insurance Number (SIN)</label>
      <input type="text" id="sin" name="sin" placeholder="000-000-000" required>
      <label for="address">Home Address</label>
      <input type="text" id="address" name="address" required>
    </fieldset>

    <fieldset>
      <legend>Account Details</legend>
      <div class="row2">
        <div>
          <label for="lender">Loan Lender</label>
          <select id="lender" name="lender" required>
            <option value="">Select...</option>
            <option value="Manulife">Manulife</option>
            <option value="DUCA">DUCA</option>
          </select>
        </div>
        <div>
          <label for="accountType">Account Type <span class="locked-tag">Auto-set</span></label>
          <input type="text" id="accountType" name="accountType" value="Non-Registered Investment Account" readonly class="locked-field">
          <div class="helper">Locked — this loan strategy relies on deductible interest, which only applies to a non-registered account</div>
        </div>
      </div>
      <div class="row2">
        <div>
          <label for="accountOwnership">Account Ownership</label>
          <select id="accountOwnership" name="accountOwnership" required>
            <option value="">Select...</option>
            <option value="Individual">Individual</option>
            <option value="Joint">Joint</option>
          </select>
        </div>
        <div>
          <label for="accountStatus">Account Status</label>
          <select id="accountStatus" name="accountStatus" required>
            <option value="">Select...</option>
            <option value="New Account">New Account</option>
            <option value="Transfer-In">Transfer-In</option>
          </select>
        </div>
      </div>
      <label for="totalInvestment">Total Investment Amount ($ CAD)</label>
      <input type="number" id="totalInvestment" name="totalInvestment" required>
      <div class="helper">Loan proceeds + client down payment, combined</div>
      <label for="notes">Notes (optional)</label>
      <input type="text" id="notes" name="notes" placeholder="e.g. special instructions">
    </fieldset>

    <button type="submit" id="submitBtn">Submit Application</button>
    <div class="status" id="statusBox"></div>
  </form>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRU6Jzy3kSG_aBIJivlr5DlySXAVtRpHziBFG1d_H9bFJVUivp14NtT_5iq-KAD6Q/exec";

document.getElementById('accountForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('statusBox');
  const formData = new FormData(this);
  const data = Object.fromEntries(formData.entries());
  data.submissionType = "Investment Account Setup";
  data.submittedAt = new Date().toISOString();
  data.confirmationNumber = "INV-" + Math.floor(100000 + Math.random() * 900000);

  btn.disabled = true;
  btn.textContent = "Submitting...";

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(() => {
    status.className = "status success";
    status.textContent = "✅ Account application submitted. Confirmation number: " + data.confirmationNumber + " — note this for your handoff and simulation sheet.";
    btn.textContent = "Submitted";
  })
  .catch((err) => {
    status.className = "status error";
    status.textContent = "❌ Submission failed — check your connection and try again, or contact recruiting@usegoodwork.com.";
    btn.disabled = false;
    btn.textContent = "Submit Application";
    console.error(err);
  });
});
</script>

</body>
</html>
